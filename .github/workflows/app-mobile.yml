name: App mobile (iOS + Android)

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/app-mobile.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: APK de test + bundle Play Store
        working-directory: mobile/android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-non-signe
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - name: Compilation iOS (simulateur, sans signature)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

  ios-testflight:
    # Envoi automatique vers TestFlight. Ne fait rien tant que les 3 secrets ASC_* ne sont pas renseignés dans GitHub.
    runs-on: macos-15
    needs: ios
    defaults: { run: { working-directory: mobile } }
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: 5XMBG5V5C3
    steps:
      - id: chk
        working-directory: .
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Secrets App Store Connect absents : envoi TestFlight ignoré."; fi
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.chk.outputs.ok == 'true'
        run: npm ci && npx cap sync ios
      - if: steps.chk.outputs.ok == 'true'
        name: Archive, signature et envoi vers TestFlight
        working-directory: mobile/ios/App
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION=1.0 \
            "${AUTH[@]}" archive | tail -25
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -25
          rm -f "$KEY"
